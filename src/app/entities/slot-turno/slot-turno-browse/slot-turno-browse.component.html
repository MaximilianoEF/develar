<form [formGroup]="form">
    <div class="row mt-2">

            <mat-form-field>
                <mat-select #selDow formControlName="dow" placeholder="Día de la semana" (selectionChange)="onSelectionChange('dow', selDow.value)">
                    <mat-option *ngFor="let item of dowList" [value]="item.val">{{ item.label }}</mat-option>
                </mat-select>
            </mat-form-field>
        </div> -->
        <div class="col-md-2">
            <mat-form-field>
                <mat-select #selSede formControlName="sede" placeholder="Sede" (selectionChange)="onSelectionChange('sede', selSede.value)">
                    <mat-option *ngFor="let item of sedeList" [value]="item.val">{{ item.label }}</mat-option>
                </mat-select>
            </mat-form-field>
        </div>
        <div class="col-md-2">
            <mat-form-field>
                <mat-select #selTipo formControlName="type" placeholder="Tipo de turnera" (selectionChange)="onSelectionChange('type', selTipo.value)">
                    <mat-option *ngFor="let item of tipoTurneraList" [value]="item.val">{{ item.label }}</mat-option>
                </mat-select>
            </mat-form-field>
        </div>
        <div class="col-md-2">
            <mat-form-field>
                <mat-select #selEstado formControlName="estado" placeholder="Estado" (selectionChange)="onSelectionChange('estado', selEstado.value)">
                    <mat-option *ngFor="let item of estadosList" [value]="item.val">{{ item.label }}</mat-option>
                </mat-select>
            </mat-form-field>
        </div>
    </div>
    <mat-toolbar>
        <div class="row">
            <div class="col-12">
                <button mat-flat-button type="button" color="primary" (click)="search()">Refrescar búsqueda</button>
            </div>
        </div>
    </mat-toolbar>
</form>
