<form [formGroup]="form">
    <div class="row">
        <div class="col-md-3">
            <mat-form-field>
                <input #textSlug matInput formControlName="slug" placeholder="Denominación de UCO" (keyup)="search()">
            </mat-form-field>
        </div>
        <div class="col-md-3">
            <mat-form-field>
                <input matInput formControlName="cod_uco" placeholder="Código de UCO">
            </mat-form-field>
        </div>
    </div>
    <mat-toolbar>
        <div class="row">
            <div class="col-12">
                <button mat-flat-button type="button" color="primary" (click)="search()">Refrescar búsqueda</button>
            </div>
        </div>
    </mat-toolbar>
</form>
