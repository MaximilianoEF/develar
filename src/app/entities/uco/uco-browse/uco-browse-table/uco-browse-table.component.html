<mat-table #ingestProcessTable matSort [dataSource]="dataSource">

    <ng-container matColumnDef="select">
        <mat-header-cell *matHeaderCellDef>
            <mat-checkbox (change)="$event ? masterToggle() : null" [checked]="selection.hasValue() && isAllSelected()" [indeterminate]="selection.hasValue() && !isAllSelected()">
            </mat-checkbox>
        </mat-header-cell>
        <mat-cell *matCellDef="let row">
            <mat-checkbox (click)="$event.stopPropagation()" (change)="$event ? selection.toggle(row) : null" [checked]="selection.isSelected(row)">
            </mat-checkbox>
        </mat-cell>
    </ng-container>

    <ng-container matColumnDef="slug">
        <mat-header-cell *matHeaderCellDef mat-sort-header>Denominación UCO</mat-header-cell>
        <mat-cell *matCellDef="let item">{{ item.slug }}</mat-cell>
    </ng-container>

    <ng-container matColumnDef="cod_uco">
        <mat-header-cell *matHeaderCellDef mat-sort-header>Código de UCO</mat-header-cell>
        <mat-cell *matCellDef="let item">{{ item.cod_uco }}</mat-cell>
    </ng-container>
    
    <ng-container matColumnDef="rowactions">
        <mat-header-cell *matHeaderCellDef>&nbsp;</mat-header-cell>
        <mat-cell *matCellDef="let item">
            <mat-icon matTooltip="Editar esta UCO" class="mr-3" (click)="edit(item)">edit</mat-icon>
            <mat-icon matTooltip="Vista de UCO" class="mr-3" (click)="view(item)">visibility</mat-icon>
        </mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>

    <mat-row *matRowDef="let row; columns: displayedColumns"></mat-row>

</mat-table>

<mat-paginator #paginator [length]="10" [pageIndex]="0" [pageSize]="25" [pageSizeOptions]="[5, 10, 25, 100]">
</mat-paginator>
