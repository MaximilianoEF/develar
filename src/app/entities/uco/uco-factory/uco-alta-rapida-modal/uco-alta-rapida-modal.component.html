<h3 mat-dialog-title>Alta rápida de UCO</h3>
<form [formGroup]="formGroup" (ngSubmit)="onSubmit()">
    <mat-dialog-content>
        <div class="container-fluid p-0">
            <div class="row">
                <div class="col-md-6 col-12">
                    <mat-form-field>
                        <mat-label>Código unívoco de uco</mat-label>
                        <input matInput formControlName="cod_uco">
                    </mat-form-field>
                </div>
                <div class="col-md-6 col-12">
                    <mat-form-field>
                        <mat-label>Nombre corto</mat-label>
                        <input matInput formControlName="slug">
                    </mat-form-field>
                </div>
            </div>
            <div class="row">
                <div class="col-12">
                    <mat-form-field appearance="outline">
                        <mat-label>Descripción</mat-label>
                        <textarea matInput formControlName="descripcion"></textarea>
                    </mat-form-field>
                </div>
            </div>
        </div>
    </mat-dialog-content>
    <mat-dialog-actions>
        <button class="ml-2" mat-flat-button color="primary" type="submit" [disabled]="formGroup.invalid">
            Confirmar
        </button>
        <button class="ml-2" mat-flat-button color="warn" type="button" mat-dialog-close>
            Cancelar
        </button>
    </mat-dialog-actions>
</form>
