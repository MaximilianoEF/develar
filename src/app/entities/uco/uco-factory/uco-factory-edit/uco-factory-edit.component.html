<mat-card>
    <mat-card-title>
        (UCO) Unidad de Conservación
    </mat-card-title>
    <form [formGroup]="formGroup" (ngSubmit)="onSubmit()">
        <mat-card-content>
            <div class="container-fluid p-0">
                <div class="row">
                    <div class="col-md-4 col-12">
                        <mat-form-field>
                            <mat-label>Código unívoco de uco</mat-label>
                            <input matInput formControlName="cod_uco">
                        </mat-form-field>
                    </div>
                    <div class="col-md-4 col-12">
                        <mat-form-field>
                            <mat-label>Nombre corto</mat-label>
                            <input matInput formControlName="slug">
                        </mat-form-field>
                    </div>
                    <div class="col-md-4 col-12">
                        <mat-form-field>
                            <mat-label>Código de barras</mat-label>
                            <input matInput formControlName="cod_barras">
                        </mat-form-field>
                    </div>
                </div>
                <div class="row">
                    <div class="col-12">
                        <mat-form-field appearance="outline">
                            <mat-label>Descripción</mat-label>
                            <textarea matInput formControlName="descripcion"></textarea>
                        </mat-form-field>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 col-12">
                        <mat-form-field>
                            <mat-label>Sede</mat-label>
                            <input matInput formControlName="sede">
                        </mat-form-field>
                    </div>
                    <div class="col-md-6 col-12">
                        <mat-form-field>
                            <mat-label>Sala</mat-label>
                            <input matInput formControlName="sala">
                        </mat-form-field>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-4 col-12">
                        <mat-form-field>
                            <mat-label>
                                Pasillo
                            </mat-label>
                            <input matInput formControlName="pasillo">
                        </mat-form-field>
                    </div>
                    <div class="col-md-4 col-12">
                        <mat-form-field>
                            <mat-label>Estantería</mat-label>
                            <input formControlName="estanteria" matInput>
                        </mat-form-field>
                    </div>
                    <div class="col-md-4 col-12">
                        <mat-form-field>
                            <mat-label>Estante</mat-label>
                            <input matInput formControlName="estante">
                        </mat-form-field>
                    </div>
                </div>
            </div>
        </mat-card-content>
        <mat-card-actions>
            <button class="ml-2" mat-flat-button color="primary" type="submit" [disabled]="formGroup.invalid">
                Confirmar
            </button>
            <button class="ml-2" mat-flat-button color="warn" type="button" (click)="goToBrowse()">
                Cancelar
            </button>
        </mat-card-actions>
    </form>
</mat-card>
