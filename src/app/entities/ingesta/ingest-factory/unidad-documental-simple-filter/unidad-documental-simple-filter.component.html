<div class="container-fluid p-0">
    <div class="row">
        <div class="col-md-6 col-12">
            <mat-form-field appearance="outline">
                <mat-label>Buscar UDC vía identificador</mat-label>
                <input #filterBox matInput id="filter-box" (keyup)="search(filterBox.value)">
            </mat-form-field>
        </div>
        <div class="col-md-4" *ngIf="udc$ | async">
            <button mat-flat-button color="primary" (click)="altaUDS()">Alta UDS</button>
        </div>
    </div>
</div>
