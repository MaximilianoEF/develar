<mat-card class="mat-elevation-z4">
  <mat-tree [dataSource]="dataSource" [treeControl]="treeControl">
    <mat-tree-node *matTreeNodeDef="let node;" matTreeNodePadding>

      <ng-container *ngIf="assetHookList && assetHookList.length > 0">
        <img src="/download/thumbnail/{{ getAssetIdFromAssetHookListWithNode(node.files) }}" alt="{{ node.item }}">
      </ng-container>

      <ng-container *ngIf="!node.assetIds || node.assetIds.length == 0">
        <button mat-icon-button>
          <mat-icon>content_copy</mat-icon>
        </button>
      </ng-container>

      <span class="navegable" (click)="goToEditView(node._id)" matTooltip="">{{ node.item }} :: [{{ node.files }}] </span>

      <mat-icon class="navegable" matTooltip="Editar la UDA" (click)="abrirMiniEditorUda(node._id)">chevron_right</mat-icon>

    </mat-tree-node>

    <mat-tree-node *matTreeNodeDef="let node; when: hasChild" matTreeNodePadding>
      <button mat-icon-button [attr.aria-label]="'Toggle ' + node.item" matTreeNodeToggle>
        <mat-icon class="mat-icon-rtl-mirror">
          {{treeControl.isExpanded(node) ? 'folder_open' : 'folder'}}
        </mat-icon>
      </button> <span class="navegable" (click)="goToEditView(node._id)">{{node.item}} :: [{{ node.files }}] </span>

      <mat-icon class="navegable" matTooltip="Editar la UDA" (click)="abrirMiniEditorUda(node._id)">chevron_right</mat-icon>

      <mat-progress-bar *ngIf="node.isLoading" mode="indeterminate" class="example-tree-progress-bar">
      </mat-progress-bar>
    </mat-tree-node>
  </mat-tree>
</mat-card>
