<h3 mat-dialog-title>Edición de SLUG PI</h3>
<p class="my-0">Está a punto de editar el SLUG: {{slug}}</p>
<form [formGroup]="form" (ngSubmit)="onSubmit()">
<mat-dialog-content>
  <div class="container-fluid p-0">
    <div class="row">
      <div class="col-12">
        <mat-form-field appearance="outline">
          <mat-label>Slug</mat-label>
          <input matInput formControlName="slug" required>
        </mat-form-field>
      </div>
    </div>
  </div>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid">Confirmar</button>
  <button class="ml-2" mat-flat-button color="warn" type="button" mat-dialog-close>Cancelar</button>
</mat-dialog-actions>
</form>
