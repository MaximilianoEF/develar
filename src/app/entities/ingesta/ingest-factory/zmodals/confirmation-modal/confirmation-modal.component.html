<h3 mat-dialog-title>{{ title }}</h3>
<mat-dialog-content>
    <div class="container-fluid p-0">
        <div class="row p-0">
            <div class="col-12">{{ message }}</div>
        </div>
    </div>
</mat-dialog-content>
<mat-dialog-actions class="mt-3 pb-3">
    <button type="button" mat-flat-button color="primary" class="ml-2" (click)="handleOnClose()">
    Sí
  </button>
    <button type="button" mat-flat-button color="warn" mat-dialog-close class="ml-2">
    No
  </button>
</mat-dialog-actions>
