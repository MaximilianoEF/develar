<h3 mat-dialog-title>{{ title }}</h3>
<mat-dialog-content>
    <div class="container-fluid p-0">
        <div *ngIf='hasErrors' class="row p-0">
            <div class="col-12">{{ erroMsgLable }}</div>
        </div>

        <ng-container *ngFor="let msg of errorMsg; let i=index;">
            <p><span><strong>{{ (i+1) + ') '  + msg }}</strong></span></p>
        </ng-container>


        <div *ngIf='!hasErrors' class="row p-0">
            <div class="col-12">{{ message }}</div>
        </div>
    </div>
</mat-dialog-content>
<mat-dialog-actions class="mt-3 pb-3">
    <button type="button" mat-flat-button color="primary" class="ml-2" [disabled]='hasErrors' (click)="handleOnClose()">
    CONFIRMAR ACCIÓN
  </button>
    <button type="button" mat-flat-button color="warn" mat-dialog-close class="ml-2">
    CANCELAR
  </button>
</mat-dialog-actions>
