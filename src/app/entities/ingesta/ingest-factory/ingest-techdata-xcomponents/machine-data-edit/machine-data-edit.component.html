<form [formGroup]="formGroup" (ngSubmit)="onSubmit()">
  <div class="container-fluid p-0">
    <div class="row">
      <div class="col-md-4 col-12">
        <mat-form-field>
          <mat-label>Ingrese DPI</mat-label>
          <input matInput formControlName="dpi">
        </mat-form-field>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6 col-12">
        <mat-form-field appearance="outline">
          <mat-label>Acciones realizadas</mat-label>
          <textarea matInput formControlName="informeTxt" ></textarea>
        </mat-form-field>
      </div>
      <div class="col-md-6 col-12">
        <mat-form-field appearance="outline">
          <mat-label>Instrucciones de ingesta</mat-label>
          <textarea style="color:black" matInput formControlName="indicacionesTxt"></textarea>
        </mat-form-field>
      </div>
    </div>
    <div class="row">
      <div class="col-12">
        <button mat-flat-button type="submit" color="primary" class="ml-2">Confirmar</button>
        <button mat-flat-button type="button" color="warn" class="ml-2" (click)="onEmitCancelar()">Cancelar</button>
      </div>
    </div>
  </div>
</form>
