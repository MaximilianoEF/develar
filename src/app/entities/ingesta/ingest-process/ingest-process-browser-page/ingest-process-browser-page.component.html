<div class="container-fluid">
  <div class="row">
    <div class="col-12">
      <mat-card>
        <mat-card-content>
          <div class="row">
            <div class="col-12">
              <mat-toolbar color="primary">
                <span class="flex-grow-1"></span>
                <button mat-flat-button (click)="openQuickCreateModal()">
                  Alta PI
                </button>
              </mat-toolbar>
            </div>
          </div>
          <ingest-process-browser (lookUpModels)="fetchIngestProcess($event)"></ingest-process-browser>
          <mat-progress-bar mode="indeterminate" *ngIf="searching"></mat-progress-bar>
          <ingest-process-browser-table *ngIf="showData"></ingest-process-browser-table>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
</div>
