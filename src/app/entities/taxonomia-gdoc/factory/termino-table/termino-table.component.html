<mat-table matSort [dataSource]="dataSource" class="mt-3">

  <ng-container matColumnDef="select">
    <mat-header-cell *matHeaderCellDef>
      <mat-checkbox (change)="$event ? masterToggle() : null"
                    [checked]="selection.hasValue() && isAllSelected()"
                    [indeterminate]="selection.hasValue() && !isAllSelected()">
      </mat-checkbox>
    </mat-header-cell>
    <mat-cell *matCellDef="let row">
      <mat-checkbox (click)="$event.stopPropagation()"
                    (change)="$event ? selection.toggle(row) : null"
                    [checked]="selection.isSelected(row)">
      </mat-checkbox>
    </mat-cell>
  </ng-container>


  <ng-container matColumnDef="identificador">
    <mat-header-cell *matHeaderCellDef>Identificador</mat-header-cell>
    <mat-cell *matCellDef="let item">
      <span class="mobile-header-cell">Identificador</span>
      {{ item.identificador }}</mat-cell>
  </ng-container>

  <ng-container matColumnDef="slug">
    <mat-header-cell *matHeaderCellDef>Mostrar como</mat-header-cell>
    <mat-cell *matCellDef="let item">
      <span class="mobile-header-cell">Mostrar como</span>
      {{ item.slug }}</mat-cell>
  </ng-container>

  <ng-container matColumnDef="descripcion">
    <mat-header-cell *matHeaderCellDef>Descripción</mat-header-cell>
    <mat-cell *matCellDef="let item">
      <span class="mobile-header-cell">Descripción</span>
      {{ item.descripcion }}</mat-cell>
  </ng-container>


  <ng-container matColumnDef="rowactions">
    <mat-header-cell *matHeaderCellDef>&nbsp;</mat-header-cell>
    <mat-cell *matCellDef="let item">
      <span class="mobile-header-cell">Acciones</span>
      <mat-icon class="ml-2" matTooltip="Editar termino" (click)="editTermino(item.source)" *ngIf="!isLocked && !item.isLocked">
        edit
      </mat-icon>
      <mat-icon class="ml-2" matTooltip="Eliminar este AR" (click)="deleteTermino(item)" *ngIf="!isLocked && !item.isLocked">
        delete
      </mat-icon>
    </mat-cell>
  </ng-container>

  <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
  <mat-row *matRowDef="let row; columns: displayedColumns"></mat-row>
</mat-table>

<mat-paginator [length]="10" [pageIndex]="0" [pageSize]="25" [pageSizeOptions]="[5, 10, 25, 100]"></mat-paginator>
