<form [formGroup]="form">
    <div class="row">
        <div class="col-md-3">
            <mat-form-field>
                <input #textSlug matInput formControlName="slug" placeholder="Denominación de MT" (keyup)="search()">
            </mat-form-field>
        </div>
        <div class="col-md-3">
            <mat-form-field>
                <input matInput formControlName="cod_machine" placeholder="Código de máquina">
            </mat-form-field>
        </div>
        <div class="col-md-3">
            <mat-form-field>
                <input matInput formControlName="marca" placeholder="Marca de la máquina">
            </mat-form-field>
        </div>
        <div class="col-md-2">
            <mat-form-field>
                <mat-select #selEntityType formControlName="type_digitalizacion" placeholder="Tipo de digitalización" (selectionChange)="onSelectionChange('type_digitalizacion', selEntityType.value)">
                    <mat-option *ngFor="let item of typeDigitalizacionList" [value]="item.val">{{ item.label }}</mat-option>
                </mat-select>
            </mat-form-field>
        </div>
    </div>
    <mat-toolbar>
        <div class="row">
            <div class="col-12">
                <button mat-flat-button type="button" color="primary" (click)="search()">Refrescar búsqueda</button>
            </div>
        </div>
    </mat-toolbar>
</form>
