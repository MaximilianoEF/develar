<mat-card>
    <mat-card-title>
        Máquinas de Tecnología
    </mat-card-title>
    <form [formGroup]="formGroup" (ngSubmit)="onSubmit()">
        <mat-card-content>
            <div class="container-fluid p-0">
                <div class="row">
                    <div class="col-md-6 col-12">
                        <mat-form-field>
                            <mat-label>Código unívoco de la máquina</mat-label>
                            <input matInput formControlName="cod_machine">
                        </mat-form-field>
                    </div>
                    <div class="col-md-6 col-12">
                        <mat-form-field>
                            <mat-label>Nombre corto</mat-label>
                            <input matInput formControlName="slug">
                        </mat-form-field>
                    </div>
                </div>
                <div class="row">
                    <div class="col-12">
                        <mat-form-field appearance="outline">
                            <mat-label>Descripción</mat-label>
                            <textarea matInput formControlName="descripcion"></textarea>
                        </mat-form-field>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-4 col-12">
                        <mat-form-field>
                            <mat-label>Marca</mat-label>
                            <input matInput formControlName="marca">
                        </mat-form-field>
                    </div>
                    <div class="col-md-4 col-12">
                        <mat-form-field>
                            <mat-label>Modelo</mat-label>
                            <input matInput formControlName="modelo">
                        </mat-form-field>
                    </div>
                    <div class="col-md-4 col-12">
                        <mat-form-field>
                            <mat-label>Fecha de incorporación</mat-label>
                            <input matInput formControlName="fecha" [matDatepicker]="picker2" required>
                            <mat-datepicker-toggle matSuffix [for]="picker2"></mat-datepicker-toggle>
                            <mat-datepicker #picker2 color="primary"></mat-datepicker>
                        </mat-form-field>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 col-12">
                        <mat-form-field>
                            <mat-label>
                                Software
                            </mat-label>
                            <input matInput formControlName="software">
                        </mat-form-field>
                    </div>
                    <div class="col-md-6 col-12">
                        <mat-form-field>
                            <mat-label>Versión de software</mat-label>
                            <input formControlName="version_software" matInput>
                        </mat-form-field>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 col-12">
                        <mat-form-field>
                            <mat-label>Tipos de digitalizaciones</mat-label>
                            <mat-select formControlName="type_digitalizacion">
                                <mat-option *ngFor="let item of typeDigitalizacionesList" [value]="item.val">
                                    {{item.label}}
                                </mat-option>
                            </mat-select>
                        </mat-form-field>
                    </div>
                    <div class="col-md-6 col-12">
                        <mat-form-field>
                            <mat-label>Usos</mat-label>
                            <input formControlName="usos" matInput>
                        </mat-form-field>
                    </div>
                </div>
            </div>
        </mat-card-content>
        <mat-card-actions>
            <button class="ml-2" mat-flat-button color="primary" type="submit" [disabled]="formGroup.invalid">
                Confirmar
            </button>
            <button class="ml-2" mat-flat-button color="warn" type="button" (click)="goToBrowse()">
                Cancelar
        </button>
        </mat-card-actions>
    </form>
</mat-card>
