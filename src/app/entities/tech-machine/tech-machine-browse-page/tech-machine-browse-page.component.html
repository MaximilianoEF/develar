<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <mat-card>
                <mat-card-content>
                    <div class="row">
                        <div class="col-12">
                            <mat-toolbar color="primary">
                                <span class="flex-grow-1"></span>
                                <button mat-flat-button (click)="openQuickCreateModal()">
                                  Alta MT

                        </div>
                    </div>
                    <tech-machine-browse (lookUpModels)="fetchIngestProcess($event)"></tech-machine-browse>

                    <tech-machine-browse-table *ngIf="showData"></tech-machine-browse-table>

                </mat-card-content>
            </mat-card>
        </div>
    </div>
</div>
