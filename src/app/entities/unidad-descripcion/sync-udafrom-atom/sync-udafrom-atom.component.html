<h3 mat-dialog-title>Sincronizar UDA desde ATOM</h3>
<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <mat-dialog-content>
    <div class="container-fluid p-0">
      <div class="row">
        <div class="col-12">
          <mat-form-field appearance="outline">
            <mat-label>Ingrese SLUG de la UDA</mat-label>
            <input matInput formControlName="atomSlug">
          </mat-form-field>
        </div>
      </div>
    </div>
  </mat-dialog-content>
  <mat-dialog-actions>
    <button class="ml-2" mat-flat-button color="primary" type="submit" [disabled]="form.invalid">Sincronizar</button>
    <button class="ml-2" mat-flat-button color="warn" type="button" mat-dialog-close>Cerrar</button>
  </mat-dialog-actions>
</form>
