<mat-card class="pb-0">
    <!-- <mat-card-title>Buscar Ancestro</mat-card-title>
    <mat-card-subtitle>Introduzca la búsqueda de su ancestro</mat-card-subtitle> -->
    <form [formGroup]="formGroup" (ngSubmit)="onSubmit()">
        <mat-card-content>
            <div class="container-fluid p-0">
                <div class="row p-0">
                    <div class="col-12">
                        <mat-form-field appearance="outline">
                            <mat-label>Buscar ancestro</mat-label>
                            <input matInput formControlName="ancestro">
                            <mat-icon matSuffix (click)="onSubmit()" class="search">search</mat-icon>
                        </mat-form-field>
                    </div>
                </div>
            </div>
        </mat-card-content>
    </form>
</mat-card>
