<mat-card>
  <mat-card-title>Material relacionado</mat-card-title>
  <form [formGroup]="formGroup" (ngSubmit)="onSubmit()">
    <div class="container-fluid p-0">
      <div class="row">
        <div class="col-12">
          <mat-form-field appearance="outline">
            <mat-label>Existencia y localización de originales</mat-label>
            <textarea matInput formControlName="existence_and_location_of_originals"></textarea>
          </mat-form-field>
        </div>
        <div class="col-12">
          <mat-form-field appearance="outline">
            <mat-label>Existencia y localización de copias</mat-label>
            <textarea matInput formControlName="existence_and_location_of_copies"></textarea>
          </mat-form-field>
        </div>
        <div class="col-12">
          <mat-form-field appearance="outline">
            <mat-label>Unidades de descripción relacionadas</mat-label>
            <textarea matInput formControlName="related_units_of_description"></textarea>
          </mat-form-field>
        </div>
        <div class="col-12">
          <mat-form-field>
            <mat-label>Descripciones relacionadas</mat-label>
            <input matInput formControlName="related_descriptions">
          </mat-form-field>
        </div>
      </div>
      <div formArrayName="publication_notes" *ngFor="let item of notasGet.controls; let i = index;">
        <div [formGroupName]="i">
          <div class="row">
            <div class="col-12">
              <mat-form-field appearance="outline">
                <mat-label>Notas de publicacion</mat-label>
                <textarea type="text" matInput formControlName="nota"></textarea>
              </mat-form-field>
            </div>
          </div>
          <hr>
        </div>
      </div>
      <div class="row">
        <button class="ml-2" mat-flat-button color="primary" type="submit">Confirmar</button>
        <button class="ml-2" mat-button color="accent" type="button" (click)="addControls()">Añadir
          nota</button>
        <button class="ml-2" mat-button color="warn" type="button" (click)="removeControl()"
          *ngIf="notasGet.length > 1">Retirar nota</button>
        <button type="button" class="ml-2" mat-flat-button color="warn" (click)="closeForm()">Cancelar</button>
      </div>
    </div>
  </form>
</mat-card>
