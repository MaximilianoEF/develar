<mat-card>
  <mat-card-title>Contenido y estructura</mat-card-title>
  <form [formGroup]="formGroup" (ngSubmit)="onSubmit()">
    <div class="container-fluid p-0">
      <div class="row">
        <div class="col-12">
          <mat-form-field appearance="outline">
            <mat-label>Alcance y contenido</mat-label>
            <textarea matInput formControlName="scope_and_content"></textarea>
          </mat-form-field>
        </div>
        <!-- <div class="col-md-8 col-12">
          <mat-form-field appearance="outline">
            <mat-label>Contenido</mat-label>
            <textarea matInput formControlName="contenido"></textarea>
          </mat-form-field>
        </div> -->
      </div>
      <div class="row">
        <!-- <div class="col-md-4 col-12">
          <mat-form-field appearance="outline">
            <mat-label>Acción</mat-label>
            <mat-select formControlName="action">
              <mat-option *ngFor="let item of actionsList" [value]="item.val">
                {{item.label}}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div> -->
        <div class="col-12">
          <mat-form-field appearance="outline">
            <mat-label>Valorización, destrucción y programación</mat-label>
            <textarea matInput formControlName="appraisal_destruction_and_scheduling"></textarea>
          </mat-form-field>
        </div>
      </div>
      <div class="row">
        <!-- <div class="col-4 my-4">
          <mat-checkbox formControlName="isAcumulacion">¿Se espera acumulaciones?</mat-checkbox>
        </div> -->
        <div class="col-12">
          <mat-form-field  appearance="outline">
            <mat-label>Estimación de su cantidad y frecuencia</mat-label>
            <textarea matInput formControlName="accruals"></textarea>
          </mat-form-field>
        </div>
      </div>
      <h5>Sistema de arreglo</h5>
      <hr>
      <div formArrayName="especificaciones" *ngFor="let esp of especificacionesGet.controls; let i = index;">
        <div [formGroupName]="i">
          <div class="row">
            <!-- <div class="col-md-4 col-12">
              <mat-form-field appearance="outline">
                <mat-label>Especificación:</mat-label>
                <mat-select formControlName="type">
                  <mat-option *ngFor="let item of arreglosList" [value]="item.val">{{ item.label }}</mat-option>
                </mat-select>
              </mat-form-field>
            </div> -->
            <div class="col-12">
              <mat-form-field appearance="outline">
                <mat-label>Descripcion</mat-label>
                <textarea type="text" matInput formControlName="system_of_arrangement"></textarea>
              </mat-form-field>
            </div>

          </div>
        </div>
        <hr>
      </div>
      <div class="row">
        <button type="submit" class="ml-2" mat-flat-button color="primary"
          [disabled]="formGroup.invalid">Confirmar</button>
        <button class="ml-2" mat-button color="accent" type="button" (click)="addControls()">Añadir
          Especificación</button>
        <button class="ml-2" mat-button color="warn" type="button" (click)="removeControl()"
          *ngIf="especificacionesGet.length > 1">Retirar Especificación</button>
        <button type="button" class="ml-2" mat-flat-button color="warn" (click)="closeForm()">Cancelar</button>
      </div>
    </div>
  </form>
</mat-card>
