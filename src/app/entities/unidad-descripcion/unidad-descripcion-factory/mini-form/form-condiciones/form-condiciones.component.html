<mat-card>
    <mat-card-title>Condiciones de acceso y uso</mat-card-title>
    <form [formGroup]="formGroup" (ngSubmit)="onSubmit()">
        <div class="container-fluid p-0">
            <div class="row">
                <div class="col-12">
                    <mat-form-field appearance="outline">
                        <mat-label>Condiciones que rigen el acceso</mat-label>
                        <textarea matInput formControlName="conditions_governing_access"> </textarea>
                    </mat-form-field>
                </div>
                <div class="col-12">
                    <mat-form-field appearance="outline">
                        <mat-label>Condiciones que rigen la reproducción</mat-label>
                        <textarea matInput formControlName="conditions_governing_reproduction"> </textarea>
                    </mat-form-field>
                </div>
                <div class="col-md-6 col-12">
                    <mat-form-field>
                        <mat-label>Idioma del material</mat-label>
                        <mat-select formControlName="languages_of_material" multiple>
                            <mat-option *ngFor="let item of idiomasList" [value]="item.val">{{item.label}}</mat-option>
                        </mat-select>
                    </mat-form-field>
                </div>
                <div class=" col-md-6 col-12">
                    <mat-form-field>
                        <mat-label>Escritura del material</mat-label>
<!--                        <input matInput formControlName="scripts_of_material">-->
                            <mat-select formControlName="scripts_of_material" multiple>
                              <mat-option *ngFor="let item of idiomasList" [value]="item.val">{{item.label}}</mat-option>
                            </mat-select>
                    </mat-form-field>
                </div>
                <div class="col-12">
                    <mat-form-field appearance="outline">
                        <mat-label>Notas de lenguaje y escritura</mat-label>
                        <textarea matInput formControlName="notas" > </textarea>
                    </mat-form-field>
                </div>
                <div class="col-12">
                    <mat-form-field appearance="outline">
                        <mat-label>Características físicas y requisitos técnicos</mat-label>
                        <textarea matInput formControlName="physical_characteristics_and_technical_requirements" ></textarea>
                    </mat-form-field>
                </div>
                <div class="col-12">
                    <mat-form-field appearance="outline">
                        <mat-label>Instrumentos de descripción</mat-label>
                        <textarea matInput formControlName="finding_aids"></textarea>
                    </mat-form-field>
                </div>
            </div>
            <div class="row">
                <button class="ml-2" mat-flat-button color="primary" type="submit">Confirmar</button>
                <button type="button" class="ml-2" mat-flat-button color="warn" (click)="closeForm()">Cancelar</button>
            </div>
        </div>
    </form>
</mat-card>
