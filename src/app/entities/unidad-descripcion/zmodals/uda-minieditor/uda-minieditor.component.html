<h3 mat-dialog-title>Edición rápida de UDA</h3>

<mat-dialog-content>
  <div class="row mb-4">
    <div class="col-12">
      <mat-checkbox [(ngModel)]="mostrarBuscadorDeUda">Editando registro [{{ udaId }}]</mat-checkbox>
    </div>
  </div>

  <form [formGroup]="form">
    <div class="row">
      <div class="col-6">
        <mat-form-field>
          <mat-label>Identificador:</mat-label>
          <input matInput formControlName="identificador">
        </mat-form-field>
      </div>
      <div class="col-6">
        <mat-form-field>
          <mat-label>Inventario:</mat-label>
          <input matInput formControlName="inventario">
        </mat-form-field>
      </div>
      <!-- <div class="col-6">
        <mat-form-field>
          <mat-label>Título:</mat-label>
          <input matInput formControlName="titulo">
        </mat-form-field>
      </div> -->
    </div>

    <div class="row">
      <div class="col-12">
        <mat-form-field>
          <mat-label>Título:</mat-label>
          <input matInput formControlName="titulo">
        </mat-form-field>
      </div>
    </div>

    <div class="row">
      <div class="col-3">
        <mat-form-field>
          <mat-label>Tipo Fecha: </mat-label>
          <mat-select formControlName="fechaTipo">
            <mat-option *ngFor="let item of tipoFechaList" [value]="item.val">
              {{ item.label }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <div class="col-3">
        <mat-form-field>
          <mat-label>Fecha Texto: </mat-label>
          <input matInput formControlName="fechaTexto">
        </mat-form-field>
      </div>

      <div class="col-3">
        <mat-form-field>
          <mat-label>Fecha DESDE: </mat-label>
          <input matInput [matDatepicker]="fechaDesde" formControlName="fechaDesde">
          <mat-datepicker-toggle matSuffix [for]="fechaDesde"></mat-datepicker-toggle>
          <mat-datepicker #fechaDesde color="accent" disabled="false"></mat-datepicker>
        </mat-form-field>
      </div>

      <div class="col-3">
        <mat-form-field>
          <mat-label>Fecha HASTA: </mat-label>
          <input matInput [matDatepicker]="fechaHasta" formControlName="fechaHasta">
          <mat-datepicker-toggle matSuffix [for]="fechaHasta"></mat-datepicker-toggle>
          <mat-datepicker #fechaHasta color="accent" disabled="false"></mat-datepicker>
        </mat-form-field>
      </div>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions>
  <button type="button" mat-flat-button color="primary" (click)="grabar()">Confirmar</button>
  <button type="button" mat-flat-button color="warn" (click)="cerrarVentana()">Cancelar</button>
</mat-dialog-actions>
