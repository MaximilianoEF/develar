<h3 mat-dialog-title>Exportación de UDAs</h3>
<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <mat-dialog-content>
    <div class="container-fluid p-0">
      <div class="row">
        <div class="col-12">
          <p class="mb-0">Seleccione el tipo de exportación que desea realizar</p>
        </div>
        <div class="col-12">
          <mat-form-field appearance="outline">
            <mat-select formControlName="reporte">
              <mat-option *ngFor="let item of tiposExportaciones" [value]="item.val">
                {{item.label}}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>
      </div>
    </div>
  </mat-dialog-content>
  <mat-dialog-actions>
    <button mat-flat-button type="submit" color="primary" [disabled]="form.invalid">Confirmar</button>
    <button mat-flat-button type="button" color="warn" class="ml-2" mat-dialog-close>Cerrar</button>
  </mat-dialog-actions>
</form>
