<h3 mat-dialog-title>Acciones UDA</h3>
<p>Complete los campos según la acción que se llevará a cabo sobre esta UDA</p>
<form [formGroup]="form" (ngSubmit)="onSubmit()">
<mat-dialog-content>
  <div class="container-fluid p-0">
    <div class="row">
      <div class="col-md-6 col-12">
        <mat-form-field>
          <mat-label>Acción</mat-label>
          <mat-select formControlName="type">
            <mat-option *ngFor="let item of actionUDAList" [value]="item.val">
              {{item.label}}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <div class="col-md-6 col-12">
        <mat-form-field>
          <mat-label>Identificador / leyenda</mat-label>
          <input matInput formControlName="actionId" required>
        </mat-form-field>
      </div>
    </div>
  </div>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-flat-button type="submit" color="primary" [disabled]="form.invalid">Confirmar</button>
  <button mat-flat-button class="ml-2" type="button" color="warn" mat-dialog-close>Cancelar</button>
</mat-dialog-actions>
</form>
