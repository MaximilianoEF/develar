<form [formGroup]="formGroup" (ngSubmit)="search()">
  <div class="row">
    <div class="col-md-4 col-12">
      <mat-form-field appearance="outline">
        <mat-label>Acción</mat-label>
        <mat-select formControlName="type">
          <mat-option *ngFor="let item of actionUdaList" [value]="item.val">
            {{item.label}}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>
    <div class="col-md-8 col-12">
      <mat-form-field appearance="outline">
        <mat-label>Identificador / Leyenda</mat-label>
        <input matInput formControlName="actionId">
      </mat-form-field>
    </div>
  </div>
  <div class="row">
    <div class="col-md-4 col-12">
      <mat-form-field appearance="outline">
        <mat-label>Nivel de descripción</mat-label>
        <mat-select formControlName="descriptionLevel">
          <mat-option *ngFor="let item of levelOfDescriptionList" [value]="item.val">
            {{item.label}}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>
    <div class="col-md-8 col-12">
      <mat-form-field appearance="outline">
        <mat-label>Código de referencia</mat-label>
        <input #searchBox matInput id="search-box" formControlName="term">
        <mat-error *ngIf="formGroup.get('term').invalid">Ingrese al menos un caracter</mat-error>
      </mat-form-field>
    </div>
  </div>
  
  <mat-toolbar>
    <div class="row">
      <div class="col-12">
        <button class="ml-2" type="submit" mat-flat-button color="primary" [disabled]="formGroup.invalid">
          Refrescar búsqueda
        </button>
      </div>
    </div>
  </mat-toolbar>
</form>
