<h2 mat-dialog-title>Entradas de historial para [{{ registerTitle }}]</h2>
<mat-dialog-content>
    <mat-list>
        <mat-list-item *ngFor="let item of registerHistories">
            <p class="mb-0 mt-2"><strong>Revisión N° {{ item.version }}</strong> / Fecha: {{ item.fechaCreacion }}</p>
            <p>Motivo: {{ item.motivo }}</p>
            <mat-divider></mat-divider>
        </mat-list-item>
    </mat-list>
</mat-dialog-content>
