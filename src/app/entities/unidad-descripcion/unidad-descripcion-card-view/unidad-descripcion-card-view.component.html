<mat-card class="mt-3 mat-elevation-z0">
  <mat-card-content>
    <div class="container p-0">

      <div class='row my-1 content-header'>
        <div class="col-md-3 content-header-elem">{{ archiveId }}
        </div>
        <div class="col-md-3 content-header-elem"> {{atomSlug}}
        </div>
        <div class="col-md-4 content-header-elem"> {{fecha}}
        </div>
        <div class="col-md-2 content-header-recurso"> {{recursoDigital}}
        </div>
      </div>

      <h5 class="titulo my-1">
        <ng-container *ngIf="uda.reference_code">
          {{uda.reference_code}}
        </ng-container>
      </h5>
      <h6 class="titulo my-1">
        {{uda.title}}
      </h6>

      <div class="row" *ngIf="shouldDisplayThumbnail">
        <div class="col-12">
          <img *ngFor="let item of uda.assetIds" src="/download/thumbnail/{{ item }}" alt="{{ uda.title }}">
        </div>
      </div>

      <div class="row" *ngIf="shouldDisplayDefaultThumbnail">
        <div class="col-12">
          <img *ngIf="isUdc" src="/assets/img/icono-carpeta.jpg" alt="{{ uda.title }}" height="100">
          <img *ngIf="isUds" src="/assets/img/icono-archivo.png" alt="{{ uda.title }}" height="100">
        </div>
      </div>

      <div class="row">
        <div class="col-12">
          <button mat-icon-button type="button" matTooltip="Ir a vista detallada" (click)="navegarAVistaDetallada()">
            <mat-icon>
              search_outline
            </mat-icon>
          </button>
        </div>
      </div>
    </div>
  </mat-card-content>
</mat-card>
