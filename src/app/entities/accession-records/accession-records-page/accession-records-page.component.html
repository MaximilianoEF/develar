<div class="container-fluid">
  <div class="row">
    <div class="col-12">
      <mat-card>
        <mat-card-content>
          <div class="row">
            <div class="col-12">
              <mat-toolbar color="primary">
                <span class="flex-grow-1"></span>
                <!-- <button mat-flat-button (click)="openAltaRapida()">Alta de PA</button> -->
              </mat-toolbar>
            </div>
          </div>
          <accession-records-browse (lookUpModels)="fetch($event)"></accession-records-browse>
          <mat-progress-bar mode="indeterminate" *ngIf="searching"></mat-progress-bar>
          <accession-records-table *ngIf="showData" (altaRapida)="openAltaRapida($event)"></accession-records-table>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
</div>
