<div class="container-fluid">
    <h1 mat-dialog-title class="mb-0">Dar de alta un registro de autoridad</h1>
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <mat-dialog-content>
            <div class="row mx-0 mt-1">
                <div class="col-12 col-md-6 pl-0">
                    <mat-form-field>
                        <mat-label>Tipo de entidad:</mat-label>
                        <mat-select #selEntityType formControlName="entityType" required>
                            <mat-option *ngFor="let item of entityTypeList" [value]="item.val">{{ item.label }}</mat-option>
                        </mat-select>
                    </mat-form-field>
                </div>
                <div class="col-12 col-md-6 pl-0 pl-md-3 pr-md-0">
                    <mat-form-field>
                        <mat-label>Identificador:</mat-label>
                        <input matInput formControlName="identifier" required>
                    </mat-form-field>
                </div>
            </div>
            <div class="row mx-0 mt-1">
                <div class="col-12 px-0">
                    <mat-form-field>
                        <mat-label>Forma(s) autorizada(s) del nombre:</mat-label>
                        <input matInput formControlName="authorizedName" required>
                    </mat-form-field>
                </div>
            </div>
            <div class="row mx-0 mt-2">
                <div class="col-12 px-0">
                    <mat-form-field>
                        <mat-label>Fechas de existencia:</mat-label>
                        <input matInput formControlName="existenceDates">
                    </mat-form-field>
                </div>
            </div>
        </mat-dialog-content>
        <mat-dialog-actions class="mt-3 mb-2">
            <button type="submit" mat-flat-button color="primary" [disabled]="form.invalid">Dar de alta</button>
            <button type="button" mat-flat-button color="warn" (click)="cancel()">Cancelar</button>
        </mat-dialog-actions>
    </form>
</div>
