<mat-card>
  <mat-card-title>
    <div class="container-fluid p-0">
      <div class="row">
        <div class="col-md-11 col-10">
          Buscador fondos, fílmico y sonoro
        </div>
        <div class="col-1 text-align-end">
          <button mat-icon-button type="button" (click)="showHelp('vidaBrowse')"
            matTooltip="Visualizar instructivo de uso">
            <mat-icon>
              <i class="far fa-question-circle"></i>
            </mat-icon>
          </button>
        </div>
      </div>
    </div>
  </mat-card-title>
  <mat-card-content>
    <div class="container-fluid p-0">
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="row">
          <mat-radio-group class="ml-2" formControlName="recurso" (change)="refreshBuscarEnOptListWithRecurso()">
            <mat-radio-button *ngFor="let val of recursosOptList" [value]="val.key">{{val.label}}
            </mat-radio-button>
            <button mat-icon-button type="button" (click)="addControls(true)" aria-label="Agregar criterios de búsqueda"
              matTooltip="Agregar criterio de búsqueda" *ngIf="condicionesGet.length < 10">
              <mat-icon>add_circle</mat-icon>
            </button>
            <button mat-icon-button type="button" (click)="removeControl()" aria-label="Agregar criterios de búsqueda"
              matTooltip="Retirar criterio de búsqueda" *ngIf="condicionesGet.length > 1">
              <mat-icon>remove_circle</mat-icon>
            </button>
          </mat-radio-group>
        </div>
        <div formArrayName="condiciones" *ngFor="let condicion of condicionesGet.controls; let i = index;">
          <div [formGroupName]="i">
            <div class="row">
              <div class="col-md-4 col-12">
                <mat-form-field>
                  <mat-label>Buscar</mat-label>
                  <input type="text" matInput formControlName="termino">
                </mat-form-field>
              </div>
              <div class="col-md-4 col-12">
                <mat-form-field>
                  <mat-label>En</mat-label>
                  <mat-select formControlName="buscarEn">
                    <mat-option *ngFor="let val of buscarEnOptList" [value]="val.key">
                      {{val.label}}
                    </mat-option>
                  </mat-select>
                </mat-form-field>
              </div>
              <div class="col-md-4 col-12">
                <mat-form-field>
                  <mat-label>Tipo de búsqueda</mat-label>
                  <mat-select formControlName="tipoBusqueda">
                    <mat-option *ngFor="let val of tipoBusquedaOptList" [value]="val.key">
                      {{val.label}}
                    </mat-option>
                  </mat-select>
                </mat-form-field>
              </div>
            </div>
          </div>

        </div>

        <div class="row">
          <div class="ml-md-3 ml-1">
            <button mat-flat-button type="submit" [disabled]="form.invalid || browseEnable">Buscar</button>
          </div>
          <div class="ml-md-3 ml-1">
            <button mat-flat-button type="button" [disabled]="cantExport" (click)="onExportExcel()">
              Exportar resultados
            </button>
          </div>

          <div class="ml-md-3 ml-1">
            <button mat-flat-button [routerLink]="['/']">
              <mat-icon>keyboard_arrow_left</mat-icon> Volver
            </button>
          </div>

        </div>
      </form>
    </div>
  </mat-card-content>
</mat-card>
