<div class="container" *ngIf="initForm">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <mat-card class="p-0 p-md-3 mat-elevation-z0">
            <mat-card-title>
                <div class="row">
                    <div class="col-12">
                        <h3>Turnos</h3>
                    </div>
                </div>
            </mat-card-title>
            <mat-card-content>
                <div class="row mb-5">
                    <div class="col-12">
                        <h5 class="step mt-0 px-2 py-1">1. Seleccioná sede</h5>
                        <mat-radio-group formControlName="slotId" (change)="slotChange()">
                            <ng-container *ngFor="let item of slotsList">
                                <mat-radio-button [value]="item._id">
                                    <p class="text-wrap"><b>{{ item.slug }}</b> </p>
                                </mat-radio-button>
                            </ng-container>

                        </mat-radio-group>
                    </div>
                </div>

                <div class="row mb-5" *ngIf="showCalendar">
                    <div class="col-12">
                        <h5 class="step my-0 px-2 py-1">2. Seleccioná día y horario</h5>
                        <mat-calendar [dateFilter]="disabledDaysFilter" [headerComponent]="customHeader" [minDate]="today" [selected]="theDate" (selectedChange)="handleDateSelectionChange($event)">
                        </mat-calendar>
                    </div>
                </div>

                <div class="row mb-5" *ngIf="showHorario">
                    <div class="col-12 col-md-6 mt-3">
                        <mat-form-field appearance="outline">
                            <mat-label>Seleccione una franja horaria</mat-label>
                            <mat-select #txHora formControlName="txHora" (selectionChange)="onSelectionChange('hora', txHora.value)" required>
                                <ng-container *ngFor="let item of listHoursOfSelect.items">
                                    <mat-option [value]="item.horaNum" *ngIf="item.capacidad !== 0">
                                        <b>{{item.slug}}</b>
                                    </mat-option>
                                </ng-container>
                            </mat-select>
                        </mat-form-field>
                    </div>
                </div>

                <div class="row">
                    <div class="col-12">
                        <h5 class="step mt-0 px-2 py-1">3. Fondo documental a consultar</h5>
                        <mat-form-field appearance="outline">
                            <textarea matInput formControlName="fondo" rows="10">

                          </textarea>
                        </mat-form-field>
                    </div>
                </div>
            </mat-card-content>
            <mat-card-actions class="text-right">
                <button type="submit" mat-flat-button class="mx-2 button-submit" [disabled]="form.invalid">Solicitar
                    turno</button>
                <button type="button" mat-flat-button class="button-cancel" [routerLink]="['..']">
                    <mat-icon>keyboard_arrow_left</mat-icon>Volver
                </button>
            </mat-card-actions>
        </mat-card>
    </form>

</div>
