<ng-container *ngIf="dataSource.loading$ | async">
    <mat-spinner></mat-spinner>
</ng-container>

<mat-table [dataSource]="dataSource">

    <ng-container matColumnDef="select">
        <mat-header-cell *matHeaderCellDef>
            <mat-checkbox (change)="$event ? masterToggle() : null" [checked]="selection.hasValue() && isAllSelected()" [indeterminate]="selection.hasValue() && !isAllSelected()">
            </mat-checkbox>
        </mat-header-cell>
        <mat-cell *matCellDef="let row">
            <mat-checkbox (click)="$event.stopPropagation()" (change)="$event ? selection.toggle(row) : null" [checked]="selection.isSelected(row)">
            </mat-checkbox>
        </mat-cell>
    </ng-container>

    <ng-container matColumnDef="txFechaHora">
        <mat-header-cell *matHeaderCellDef>Fecha y hora</mat-header-cell>
        <mat-cell *matCellDef="let turno">
            <span class="mobile-header-cell">Fecha y hora</span> {{ turno.txFechaHora }}
        </mat-cell>
    </ng-container>

    <ng-container matColumnDef="sede">
        <mat-header-cell *matHeaderCellDef>Sede</mat-header-cell>
        <mat-cell *matCellDef="let turno"><span class="mobile-header-cell">Sede</span>{{ turno.sede }}</mat-cell>
    </ng-container>

    <ng-container matColumnDef="sala">
        <mat-header-cell *matHeaderCellDef>Sala</mat-header-cell>
        <mat-cell *matCellDef="let turno"><span class="mobile-header-cell">Sala</span>{{ turno.sala }}</mat-cell>
    </ng-container>

    <!-- <ng-container matColumnDef="tipoConsulta">
        <mat-header-cell *matHeaderCellDef>Tipo de consulta</mat-header-cell>
        <mat-cell *matCellDef="let turno">{{ turno.tipoConsulta }}</mat-cell>
    </ng-container> -->

    <ng-container matColumnDef="detalle">
        <mat-header-cell *matHeaderCellDef>Detalle</mat-header-cell>
        <mat-cell *matCellDef="let turno"><span class="mobile-header-cell">Detalle</span>{{ turno.detalle }}</mat-cell>
    </ng-container>

    <ng-container matColumnDef="avance">
        <mat-header-cell *matHeaderCellDef>Avance</mat-header-cell>
        <mat-cell *matCellDef="let turno"><span class="mobile-header-cell">Avance</span>{{ turno.avance }}</mat-cell>
    </ng-container>

    <ng-container matColumnDef="rowactions">
        <mat-header-cell *matHeaderCellDef>&nbsp;</mat-header-cell>
        <mat-cell *matCellDef="let turno">
            <span class="mobile-header-cell">Acciones</span>
            <mat-icon matTooltip="Editar este turno" *ngIf="turno.estado != 'Cerrado'" class="mx-1" (click)="editItem(turno)">edit</mat-icon>
            <mat-icon matTooltip="Cancelar este turno" *ngIf="turno.estado != 'Cerrado'" class="mx-1" (click)="deleteItem(turno)">delete</mat-icon>

        </mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>

    <mat-row *matRowDef="let row; columns: displayedColumns"></mat-row>

</mat-table>
