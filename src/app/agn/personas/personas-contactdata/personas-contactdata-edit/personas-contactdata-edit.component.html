<mat-card class="mat-elevation-z0 p-0">
    <mat-card-content>
    <form [formGroup]="form">
  
      <!---tdato;  tdoc, ndoc--->
      <div class="row" >
        <div class="col">
          <mat-form-field>
            <mat-select #fldTipoDato placeholder="Tipo de Dato"
                formControlName="tdato"
                (selectionChange)="changeSelectionValue('tdato',fldTipoDato.value)" >
              <mat-option *ngFor="let item of tipoDeContactoList" 
                [value]="item.val" >{{ item.label }}</mat-option>
            </mat-select>
          </mat-form-field>
  
        </div>
  
        <div class="col">
          <mat-form-field>
            <input  matInput formControlName="data" placeholder="Dato (tel/mail/etc.)" >
          </mat-form-field>
        </div>
        
        <div class="col">
          <mat-form-field>
            <mat-select #fldTypeContact placeholder="Tipo de uso"
                formControlName="type"
                (selectionChange)="changeSelectionValue('type',fldTypeContact.value)" >
              <mat-option *ngFor="let item of contactTypeList" 
                [value]="item.val" >{{ item.label }}</mat-option>
            </mat-select>
          </mat-form-field>
        </div>
  
  
      </div>
  
      <!---slug--->
      <div class="row" >
        <div class="col">
          <mat-form-field>
            <input  matInput formControlName="slug" placeholder="Observación" >
          </mat-form-field>
        </div>
      </div>
  
  
      <hr>
      <div class="additional-info">
        <button mat-flat-button  type="submit" 
                (click)="onSubmit()"
            [disabled]="!form.valid" >Aceptar</button>
        
        <button class="ml-2" mat-flat-button type="button"
                (click)="onCancel()" >Cancelar</button>
  
        <button class="ml-0 ml-md-2 mt-2 mt-md-0" mat-flat-button type="button" 
            (click)="deleteToken()" >Borrar</button>
  
      </div>
  
    </form>
    </mat-card-content>
  </mat-card>
